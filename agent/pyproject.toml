[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskly-agent"
version = "0.1.0"
description = "Shared contracts and test-file policy for the Taskly test agent"
requires-python = ">=3.12"
dependencies = ["pydantic==2.13.5"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "openai==3.37.0", "httpx2==2.16.0"]
openai = ["openai==3.37.0", "httpx2==2.16.0"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
taskly_agent = ["bundled_skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
