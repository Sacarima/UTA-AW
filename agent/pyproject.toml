[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskly-agent"
version = "0.1.0"
description = "Shared contracts and test-file policy for the Taskly test agent"
requires-python = ">=3.12"
dependencies = ["pydantic==2.13.5"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
