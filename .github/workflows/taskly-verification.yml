name: Taskly isolated verification
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: taskly-verification-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout reviewed orchestration and manifests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
          set-safe-directory: false
          submodules: false
          lfs: false
      - name: Checkout pinned candidate as data only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
          set-safe-directory: false
          submodules: false
          lfs: false
      - name: Provision trusted host orchestration
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Validate trusted checkout inputs
        working-directory: trusted
        shell: bash
        run: |
          set -euo pipefail
          for input in \
            agent/pyproject.toml \
            agent/sandbox/Dockerfile \
            agent/sandbox/Dockerfile.dockerignore \
            agent/sandbox/launch.py \
            agent/src/taskly_agent/__init__.py \
            agent/src/taskly_agent/ci.py \
            agent/src/taskly_agent/docker_runner.py \
            agent/src/taskly_agent/execution.py \
            agent/src/taskly_agent/bundled_skills/python-unit-tests/SKILL.md \
            agent/src/taskly_agent/bundled_skills/react-unit-tests/SKILL.md \
            agent/src/taskly_agent/bundled_skills/update-existing-tests/SKILL.md \
            agent/src/taskly_agent/bundled_skills/review-generated-tests/SKILL.md \
            backend/requirements.txt \
            frontend/package.json \
            frontend/package-lock.json
          do
            if ! test -f "$input"; then
              printf 'Required trusted CI input missing: %s\n' "$input" >&2
              exit 1
            fi
          done
      - name: Install and test reviewed agent code
        working-directory: trusted
        run: |
          python -m venv .ci-venv
          .ci-venv/bin/python -m pip install './agent[test]'
          cd agent
          ../.ci-venv/bin/python -m pytest
      - name: Provision image from reviewed manifests only
        working-directory: trusted
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          : "${BASE_SHA:?Missing trusted base SHA}" "${RUNNER_TEMP:?Missing runner temporary directory}"
          IMAGE_ID_FILE="$RUNNER_TEMP/taskly-image.id"
          docker build \
            --platform linux/amd64 \
            --build-arg "TRUSTED_REVISION=$BASE_SHA" \
            --iidfile "$IMAGE_ID_FILE" \
            --file agent/sandbox/Dockerfile \
            .
          test -s "$IMAGE_ID_FILE"
      - name: Validate sandbox and run real Taskly suites
        working-directory: trusted
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          : "${REPOSITORY:?Missing repository name}" "${PR_NUMBER:?Missing PR number}"
          : "${BASE_SHA:?Missing base SHA}" "${HEAD_SHA:?Missing head SHA}"
          : "${RUNNER_TEMP:?Missing runner temporary directory}" "${GITHUB_STEP_SUMMARY:?Missing summary path}"
          IMAGE_ID_FILE="$RUNNER_TEMP/taskly-image.id"
          test -s "$IMAGE_ID_FILE"
          # Expand every event/path argument before env -i clears the child environment.
          env -i \
            PATH="$PATH" \
            HOME="$RUNNER_TEMP/taskly-empty-home" \
            .ci-venv/bin/python -I -m taskly_agent.ci \
            --repository ../candidate \
            --name "$REPOSITORY" \
            --number "$PR_NUMBER" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --trusted-revision "$BASE_SHA" \
            --image-file "$IMAGE_ID_FILE" \
            --summary "$GITHUB_STEP_SUMMARY"
