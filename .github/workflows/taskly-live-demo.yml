name: Taskly authorized AI backend demonstration
'on':
  workflow_dispatch:
    inputs:
      base_sha:
        description: Approved full main/base SHA (must match environment variable)
        required: true
        type: string
      head_sha:
        description: Full candidate SHA of the separate one-line backend PR
        required: true
        type: string
      pr_number:
        description: Open same-repository PR number
        required: true
        type: string
      allow_paid:
        description: Authorize one run, at most two API requests and USD 0.10 estimated cost
        required: true
        default: false
        type: boolean
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: taskly-live-demo
  cancel-in-progress: false
jobs:
  demonstrate:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Sacarima/UTA-AW' && github.ref == 'refs/heads/main' && inputs.allow_paid && github.run_attempt == 1
    environment: taskly-live-demo
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      BASE_SHA: ${{ inputs.base_sha }}
      HEAD_SHA: ${{ inputs.head_sha }}
      PR_NUMBER: ${{ inputs.pr_number }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Gate approved workflow and commit identities
        env:
          # Environment configuration variables are exposed through vars only
          # after the runner declares this job's protected environment. Keep
          # this binding step-scoped; never fall back to the submitted input.
          APPROVED_BASE: ${{ vars.TASKLY_DEMO_BASE_SHA }}
          WORKFLOW_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import os, re, sys
          values = {key: os.environ.get(key, '') for key in
                    ('BASE_SHA', 'HEAD_SHA', 'APPROVED_BASE', 'WORKFLOW_SHA', 'PR_NUMBER')}
          base, head = values['BASE_SHA'], values['HEAD_SHA']
          # Preserve the original expression exactly; do not strip or normalize
          # inputs to make malformed identities pass.
          valid = (re.fullmatch(r'[0-9a-f]{40}', base) and re.fullmatch(r'[0-9a-f]{40}', head)
                   and base != head and base == values['APPROVED_BASE'] == values['WORKFLOW_SHA']
                   and re.fullmatch(r'[1-9][0-9]{0,9}', values['PR_NUMBER']))
          checks = {
              'base_sha_format_valid': bool(re.fullmatch(r'[0-9a-f]{40}', base)),
              'head_sha_format_valid': bool(re.fullmatch(r'[0-9a-f]{40}', head)),
              'base_head_distinct': base != head,
              'approval_matches_base': values['APPROVED_BASE'] == base,
              'workflow_matches_base': values['WORKFLOW_SHA'] == base,
              'pr_number_format_valid': bool(re.fullmatch(r'[1-9][0-9]{0,9}', values['PR_NUMBER'])),
          }
          for key, value in values.items():
              checks[key + '_present'] = bool(value)
              checks[key + '_has_outer_whitespace'] = value != value.strip()
              checks[key + '_ascii_only'] = value.isascii()
              checks[key + '_contains_quote'] = "'" in value or '"' in value
          for name, passed in checks.items():
              print('identity_gate.' + name + '=' + str(passed).lower())
          if not valid:
              sys.exit('Approved workflow/PR identities are missing or inconsistent.')
          PY
      - name: Checkout approved agent and provisioning inputs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.base_sha }}
          path: trusted
          persist-credentials: false
          set-safe-directory: false
          submodules: false
          lfs: false
      - name: Provision trusted Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Install reviewed orchestration only
        working-directory: trusted
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir "$RUNNER_TEMP/taskly-demo"
          python -m venv "$RUNNER_TEMP/demo-venv"
          "$RUNNER_TEMP/demo-venv/bin/python" -m pip install './agent[openai]'
      - name: Validate actual GitHub PR identity
        working-directory: trusted
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: github.com
        shell: bash
        run: |
          set -euo pipefail
          timeout 20s gh api --hostname github.com "repos/$REPOSITORY/pulls/$PR_NUMBER" \
            > "$RUNNER_TEMP/taskly-demo/pr.json" 2>/dev/null
          "$RUNNER_TEMP/demo-venv/bin/python" -I -m taskly_agent.live_demo check-pr \
            --name "$REPOSITORY" --number "$PR_NUMBER" --base "$BASE_SHA" --head "$HEAD_SHA" \
            --metadata "$RUNNER_TEMP/taskly-demo/pr.json"
      - name: Checkout pinned candidate as Git data only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.head_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
          set-safe-directory: false
          submodules: false
          lfs: false
      - name: Admit exact demonstration delta and fixed spending configuration
        working-directory: trusted
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/demo-venv/bin/python" -I -m taskly_agent.live_demo check-candidate \
            --repository ../candidate --name "$REPOSITORY" --number "$PR_NUMBER" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --config "$RUNNER_TEMP/taskly-demo/config.json"
      - name: Build immutable sandbox from approved base only
        working-directory: trusted
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/docker build --platform linux/amd64 --build-arg "TRUSTED_REVISION=$BASE_SHA" \
            --iidfile "$RUNNER_TEMP/taskly-demo/image.id" --file agent/sandbox/Dockerfile .
          test -s "$RUNNER_TEMP/taskly-demo/image.id"
      - name: Run existing agent with explicit paid authorization
        id: pipeline
        working-directory: trusted
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY"
          IMAGE=$(cat "$RUNNER_TEMP/taskly-demo/image.id")
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" OPENAI_API_KEY="$OPENAI_API_KEY" \
            "$RUNNER_TEMP/demo-venv/bin/python" -I -m taskly_agent.end_to_end \
            --repository ../candidate --name "$REPOSITORY" --number "$PR_NUMBER" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --trusted-revision "$BASE_SHA" \
            --image "$IMAGE" --config "$RUNNER_TEMP/taskly-demo/config.json" --allow-paid \
            > "$RUNNER_TEMP/taskly-demo/report.raw.json" 2> "$RUNNER_TEMP/taskly-demo/summary.raw.txt"
      - name: Validate and sanitize evidence artifact
        id: evidence
        if: ${{ always() && (steps.pipeline.outcome == 'success' || steps.pipeline.outcome == 'failure') }}
        working-directory: trusted
        shell: bash
        run: |
          set -euo pipefail
          env -i PATH=/usr/bin:/bin HOME="$RUNNER_TEMP" \
            "$RUNNER_TEMP/demo-venv/bin/python" -I -m taskly_agent.live_demo publish \
            --name "$REPOSITORY" --number "$PR_NUMBER" --base "$BASE_SHA" --head "$HEAD_SHA" \
            --report "$RUNNER_TEMP/taskly-demo/report.raw.json" \
            --image-file "$RUNNER_TEMP/taskly-demo/image.id" \
            --artifact "$RUNNER_TEMP/taskly-demo/evidence.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload sanitized evidence only
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: taskly-live-demo-${{ github.run_id }}
          path: ${{ runner.temp }}/taskly-demo/evidence.json
          if-no-files-found: error
          retention-days: 3
          include-hidden-files: false
